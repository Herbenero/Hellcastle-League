<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hellcastle Archery Arena League</title>
    <!-- Include Firebase SDKs if required by your setup -->
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #333;
            --gold: #d4af37;
            --accent-color: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        button, select, input {
            background: #2a2a2a;
            color: white;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            margin: 4px 0;
        }
        button {
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #3a3a3a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 Hellcastle Archery Arena League</h1>
        
        <!-- Active League Section -->
        <div class="card">
            <h2>1. Active League Setup</h2>
            <select id="select-league-dropdown">
                <option value="">-- Select Existing League --</option>
            </select>
            <div id="active-league-display">Current Active League: None</div>
        </div>

        <!-- Enter Event Results Section -->
        <div class="card">
            <h2>2. Enter Event Results</h2>
            <label for="event-select">Select Event:</label>
            <select id="event-select">
                <option value="">-- Choose Event --</option>
                <option value="Count Up">Count Up</option>
                <option value="Tic Tac Toe">Tic Tac Toe</option>
                <option value="301">301</option>
                <option value="Robin Hood">Robin Hood</option>
                <option value="JDC Jr">JDC Jr</option>
                <option value="Gold Rush">Gold Rush</option>
                <option value="Shanghai">Shanghai</option>
                <option value="Snapshot">Snapshot</option>
                <option value="Roman Empire">Roman Empire</option>
                <option value="Basketball">Basketball</option>
                <option value="All 5s">All 5s</option>
                <option value="Golf">Golf</option>
                <option value="Horse Race">Horse Race</option>
                <option value="Football Darts">Football Darts</option>
                <option value="Shove a Penny">Shove a Penny</option>
                <option value="Redlarovia">Redlarovia</option>
                <option value="Pool">Pool</option>
                <option value="Hockey">Hockey</option>
                <option value="Blackjack">Blackjack</option>
                <option value="Bermuda Triangle">Bermuda Triangle</option>
            </select>

            <div id="score-inputs-container" style="margin-top: 15px;">
                <!-- Dynamic player input fields render here -->
            </div>
            
            <button id="submit-scores-btn" style="margin-top: 10px; background: var(--accent-color);">Submit Scores</button>
        </div>
    </div>

    <script>
        // Stub functions for core league actions referenced in your codebase
        function setNowDate() { console.log("Date set"); }
        async function fetchSavedLeagues() { console.log("Leagues fetched"); }
        async function loadSelectedLeague() { console.log("League loaded"); }
        function renderScoreInputs() {
            const container = document.getElementById("score-inputs-container");
            container.innerHTML = `
                <div style="margin-bottom: 10px;">
                    <label><strong>Herb</strong> Score:</label><br>
                    <input type="number" class="player-score-field" data-player="Herb" placeholder="Enter score"><br>
                    <input type="text" class="player-notes-field" data-player="Herb" placeholder="Add notes or remarks for Herb...">
                </div>
                <div style="margin-bottom: 10px;">
                    <label><strong>Kelly</strong> Score:</label><br>
                    <input type="number" class="player-score-field" data-player="Kelly" placeholder="Enter score"><br>
                    <input type="text" class="player-notes-field" data-player="Kelly" placeholder="Add notes or remarks for Kelly...">
                </div>
            `;
        }

        // Trigger dynamic inputs when event changes
        document.getElementById("event-select").addEventListener("change", () => {
            renderScoreInputs();
        });

        // Window exposures
        window.renderScoreInputs = renderScoreInputs;

        // --- AUTOMATED BRIDGE LISTENER FOR COUNT UP ---
        window.addEventListener("DOMContentLoaded", async () => {
            setNowDate();
            await fetchSavedLeagues();
            await loadSelectedLeague();

            // Check if pending match data was passed from Count Up via localStorage
            const pendingData = localStorage.getItem("haalis_pending_match");
            if (!pendingData) return;

            try {
                const match = JSON.parse(pendingData);
                
                // 1. Select the event in the dropdown and trigger change so inputs render
                const eventSelect = document.getElementById("event-select");
                if (eventSelect) {
                    eventSelect.value = match.event;
                    eventSelect.dispatchEvent(new Event("change"));
                }

                // 2. Wait briefly for renderScoreInputs() to build the DOM inputs, then fill scores & remarks
                setTimeout(() => {
                    match.players.forEach(player => {
                        const scoreInput = document.querySelector(`.player-score-field[data-player="${player.name}"]`);
                        if (scoreInput) {
                            scoreInput.value = player.score;
                            scoreInput.dispatchEvent(new Event("input"));
                        }

                        const notesInput = document.querySelector(`.player-notes-field[data-player="${player.name}"]`);
                        if (notesInput && player.ppr) {
                            notesInput.value = `PPR: ${player.ppr}`;
                            notesInput.dispatchEvent(new Event("input"));
                        }
                    });

                    // Clear localStorage so it doesn't re-trigger on subsequent refreshes
                    localStorage.removeItem("haalis_pending_match");
                    console.log("Successfully auto-filled pending match from Count Up!");
                }, 150);

            } catch (e) {
                console.error("Error auto-filling pending league match:", e);
            }
        });
    </script>
</body>
</html>
