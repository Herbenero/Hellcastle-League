<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hellcastle League Manager</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333;
            --teal: #008080;
            --purple: #6a0dad;
            --orange: #ff8c00;
            --gold: #ffd700;
            --danger-color: #cc0000;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h2 {
            margin-top: 0;
            color: var(--gold);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        button {
            background: var(--purple);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        .btn-danger {
            background: var(--danger-color);
        }

        #current-league-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--teal);
            padding: 12px 18px;
            border-radius: 6px;
            margin-bottom: 20px;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--orange);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 8px;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Active League Controls & Records Button -->
        <div id="current-league-header">
            <span>Current Active League: <strong id="current-league-text">Hellcastle Archery League</strong></span>
            <div style="display: flex; gap: 8px;">
                <button style="background: var(--gold); color: #000; padding: 6px 12px; font-size: 0.9em;" onclick="showLeagueRecords()">🏆 Records</button>
                <button class="btn-danger" style="padding: 6px 12px; font-size: 0.9em;" onclick="deleteCurrentLeague()">🗑️ Delete League</button>
            </div>
        </div>

        <!-- 1. League Setup / Event Control Panel -->
        <div class="card">
            <h2>🎯 Event Control Panel</h2>
            <div class="form-group">
                <label for="event-date">Event Date & Time</label>
                <input type="datetime-local" id="event-date">
            </div>
            <div id="score-inputs-container">
                <!-- Dynamic score inputs populated here -->
            </div>
        </div>

        <!-- 2. Standings Leaderboard -->
        <div class="card">
            <h2>🏆 Standings Leaderboard</h2>
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Athlete</th>
                        <th>Total Points</th>
                        <th>Wins (W)</th>
                        <th>Losses (L)</th>
                        <th>Ties (T)</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- Standings populated dynamically -->
                </tbody>
            </table>
        </div>

        <!-- 3. Event Log -->
        <div class="card">
            <h2>📜 Event Log</h2>
            <div id="completed-events-log">
                <!-- Completed events populated dynamically -->
            </div>
        </div>
    </div>

    <!-- Main Application Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, deleteDoc, collection, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvL2K8R82qk3fG4EEKZ6sOIiieLcCKckA",
            authDomain: "haal-fc862.firebaseapp.com",
            projectId: "haal-fc862",
            storageBucket: "haal-fc862.firebasestorage.app",
            messagingSenderId: "1077392905739",
            appId: "1:1077392905739:web:cc047fae886356663fd90e",
            measurementId: "G-P99RVN1XBF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Application State
        let currentLeagueName = "Hellcastle Archery League";
        let editingIndex = null;
        const players = [];
        const events = [];
        const completedEvents = [];
        const pointsMap = { 1: 25, 2: 20, 3: 15 };

        function setNowDate() {
            const dateInput = document.getElementById('event-date');
            if (dateInput) {
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                dateInput.value = now.toISOString().slice(0, 16);
            }
        }

        function getSanitizedDocId(name) {
            return name ? name.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '_') : '';
        }

        async function syncLeagueToFirebase() {
            const sanitizedDocId = getSanitizedDocId(currentLeagueName);
            if (!sanitizedDocId) return;
            const leagueRef = doc(db, "leagues", sanitizedDocId);
            try {
                await setDoc(leagueRef, {
                    leagueName: currentLeagueName,
                    lastUpdated: serverTimestamp(),
                    completedEvents: completedEvents
                }, { merge: true });
            } catch (error) {
                console.error("Error syncing league to Firebase:", error);
            }
        }

        // --- Records Modal Feature ---
        function showLeagueRecords() {
            if (!completedEvents || completedEvents.length === 0) {
                alert("No completed events recorded in this league yet.");
                return;
            }

            const gameRecords = {};

            completedEvents.forEach(evt => {
                const gameName = evt.eventName || "Unknown Game";

                if (!gameRecords[gameName]) {
                    gameRecords[gameName] = {
                        highScore: null,
                        recordHolders: [],
                        subscoreRecords: {}
                    };
                }

                if (evt.results && Array.isArray(evt.results)) {
                    evt.results.forEach(res => {
                        // Main score tracking
                        if (res.score !== undefined && !isNaN(res.score)) {
                            const scoreNum = Number(res.score);
                            const currentRecord = gameRecords[gameName].highScore;

                            if (currentRecord === null || scoreNum > currentRecord.score) {
                                gameRecords[gameName].highScore = { score: scoreNum, name: res.name };
                                gameRecords[gameName].recordHolders = [res.name];
                            } else if (scoreNum === currentRecord.score) {
                                if (!gameRecords[gameName].recordHolders.includes(res.name)) {
                                    gameRecords[gameName].recordHolders.push(res.name);
                                }
                            }
                        }

                        // Subscore tracking (for multi-metric games like JDC Jr)
                        if (res.subscores && typeof res.subscores === 'object') {
                            for (const [subKey, subVal] of Object.entries(res.subscores)) {
                                if (subVal !== '' && !isNaN(subVal)) {
                                    const numVal = Number(subVal);
                                    if (!gameRecords[gameName].subscoreRecords[subKey]) {
                                        gameRecords[gameName].subscoreRecords[subKey] = { score: numVal, holders: [res.name] };
                                    } else {
                                        const subRec = gameRecords[gameName].subscoreRecords[subKey];
                                        if (numVal > subRec.score) {
                                            gameRecords[gameName].subscoreRecords[subKey] = { score: numVal, holders: [res.name] };
                                        } else if (numVal === subRec.score && !subRec.holders.includes(res.name)) {
                                            subRec.holders.push(res.name);
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
            });

            // Build UI for records
            let recordsHtml = '';
            for (const [gameName, data] of Object.entries(gameRecords)) {
                let subscoresHtml = '';
                if (Object.keys(data.subscoreRecords).length > 0) {
                    subscoresHtml = '<div style="margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--orange); font-size: 0.9em; color: var(--text-muted);">';
                    for (const [subName, subData] of Object.entries(data.subscoreRecords)) {
                        subscoresHtml += `<div>🔹 <strong>${subName}:</strong> ${subData.score} (${subData.holders.join(', ')})</div>`;
                    }
                    subscoresHtml += '</div>';
                }

                const holdersText = data.highScore ? `${data.highScore.score} pts — <strong>${data.recordHolders.join(', ')}</strong>` : 'No scores logged yet';

                recordsHtml += `
                    <div style="background: #252525; border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; margin-bottom: 10px;">
                        <div style="color: var(--gold); font-size: 1.05em; font-weight: bold; margin-bottom: 4px;">🎯 ${gameName}</div>
                        <div style="font-size: 0.95em;">🏆 High Score: ${holdersText}</div>
                        ${subscoresHtml}
                    </div>
                `;
            }

            const modalHtml = `
                <div id="league-records-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000;">
                    <div style="background: var(--card-bg); padding: 25px; border-radius: 8px; max-width: 580px; width: 90%; max-height: 85vh; overflow-y: auto; border: 1px solid var(--border-color); position: relative;">
                        <button onclick="document.getElementById('league-records-modal').remove()" style="position: absolute; top: 12px; right: 12px; background: none; border: none; color: white; font-size: 1.3em; cursor: pointer;">✖</button>
                        <h2 style="color: var(--gold); margin-top: 0; margin-bottom: 5px;">🏆 ${currentLeagueName} Records</h2>
                        <p style="margin-top: 0; color: var(--text-muted); font-size: 0.95em; margin-bottom: 20px;">All-time high scores and personal best breakdowns.</p>
                        <div>
                            ${recordsHtml}
                        </div>
                    </div>
                </div>
            `;

            const oldModal = document.getElementById('league-records-modal');
            if (oldModal) oldModal.remove();
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        window.showLeagueRecords = showLeagueRecords;
        window.deleteCurrentLeague = function() {
            if (confirm(`Are you sure you want to delete the league "${currentLeagueName}"?`)) {
                alert("League deletion triggered.");
            }
        };

        // Initialize date on load
        window.addEventListener('DOMContentLoaded', () => {
            setNowDate();
        });
    </script>
</body>
</html>
