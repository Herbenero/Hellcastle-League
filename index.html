      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #e0e0e0;

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);

    h1, h2, h3 {

      color: var(--gold);

    .card {
      background-color: var(--card-bg);

      margin-bottom: 20px;

      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background-color: #2a2a2a;
      color: #fff;
      box-sizing: border-box;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      background-color: var(--accent);
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: var(--accent-hover);
    }
    .tag-list {

      flex-wrap: wrap;

      margin-top: 10px;

    .tag {

      border-radius: 15px;

    .tag button {

      color: #ff5555;

<body>

  <h1>🏆 Hellcastle Archery Arena League</h1>

  <!-- 1. Active League Setup -->
  <div class="card">
    <h2>1. Active League Setup</h2>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
      <div>
        <div class="form-group">
          <label for="league-select">Continue Saved League</label>
          <select id="league-select" onchange="loadSelectedLeague()">
            <option value="">-- Select Existing League --</option>
          </select>
        </div>
      </div>
      <div>
        <div class="form-group">
          <label for="league-name-input">Create New League Name</label>
          <div class="btn-group">
            <input type="text" id="league-name-input" placeholder="e.g. Hellcastle Archery League">
            <button onclick="setActiveLeague()">Set League</button>
          </div>
        </div>
      </div>
    </div>

    <h3 id="current-league-header" style="font-size: 1.1rem; margin-bottom: 1rem;">
      Current Active League: <strong>Hellcastle Archery League</strong>
    </h3>

    <hr style="border-color: var(--border); margin-bottom: 1.5rem;">

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
      <div>
        <div class="form-group">
          <label for="player-input">Add Combatant / Player Name</label>
          <div class="btn-group">
            <input type="text" id="player-input" placeholder="e.g. John Doe" onkeydown="if(event.key==='Enter') addPlayer()">
            <button onclick="addPlayer()">Add</button>
          </div>
        </div>
        <div id="player-tags" class="tag-list"></div>
      </div>
      <div>
        <div class="form-group">
          <label for="event-input">Add Event Name</label>
          <div class="btn-group">
            <input type="text" id="event-input" placeholder="e.g. Robin Hood" onkeydown="if(event.key==='Enter') addEvent()">
            <button onclick="addEvent()">Add</button>
          </div>
        </div>
        <div id="event-tags" class="tag-list"></div>
      </div>
    </div>
  </div>

  <!-- 2. Enter Event Results -->
  <div class="card">
    <h2>2. Enter Event Results</h2>
    <div class="form-group">
      <label for="event-select">Select Event</label>
      <select id="event-select" onchange="renderScoreInputs()">
        <option value="">-- Choose Event --</option>
      </select>
    </div>
    <div class="form-group">
      <label for="score-type">Scoring Metric</label>
      <select id="score-type">
        <option value="high">High Score Wins</option>
        <option value="low">Low Score Wins</option>
      </select>
    </div>
    <div id="score-inputs-container"></div>
  </div>

  <!-- 3. League Standings -->
  <div class="card">
    <h2>🏆 Standings Leaderboard</h2>
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Athlete</th>
          <th>Total Points</th>
          <th>1st</th>
          <th>2nd</th>
          <th>3rd</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </div>

  <!-- 4. Completed Events History -->
  <div class="card">
    <h2>Completed Events Log</h2>
    <div id="completed-events-log"></div>
  </div>

  <script>
    // --- Application State ---
    let currentLeagueName = "Hellcastle Archery League";
    const players = [];
    const events = [];
    const completedEvents = [];

    const pointsMap = { 1: 25, 2: 20, 3: 15 };
    const medalsMap = { 1: '🥇', 2: '🥈', 3: '🥉' };

    // --- Firebase League Helpers ---
    async function fetchSavedLeagues() {
      if (!window.db) return;
      const select = document.getElementById('league-select');
      if (!select) return;
      select.innerHTML = '<option value="">-- Select Existing League --</option>';

      try {
        const querySnapshot = await window.getDocs(window.collection(window.db, "leagues"));
        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          if (data.leagueName) {
            const opt = document.createElement('option');
            opt.value = data.leagueName;
            opt.textContent = data.leagueName;
            select.appendChild(opt);
          }
        });
      } catch (err) {
        console.error("Error fetching leagues:", err);
      }
    }

    function setActiveLeague() {
      const input = document.getElementById('league-name-input');
      const name = input.value.trim();
      if (!name) {
        alert("Please enter a valid league name.");
        return;
      }
      currentLeagueName = name;
      document.getElementById('current-league-header').innerHTML = `Current Active League: <strong>${currentLeagueName}</strong>`;
      input.value = '';
    }

    async function loadSelectedLeague() {
      const select = document.getElementById('league-select');
      const leagueName = select.value;
      if (!leagueName) return;

      currentLeagueName = leagueName;
      document.getElementById('current-league-header').innerHTML = `Current Active League: <strong>${currentLeagueName}</strong>`;

      const docId = leagueName.trim().replace(/\s+/g, '_');
      const leagueRef = window.doc(window.db, "leagues", docId);

      try {
        const docSnap = await window.getDoc(leagueRef);
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.completedEvents) {
            completedEvents.length = 0;
            completedEvents.push(...data.completedEvents);

            // Populate player list dynamically from historical data
            data.completedEvents.forEach(evt => {
              evt.results.forEach(res => {
                if (res.name && !players.includes(res.name)) {
                  players.push(res.name);
                }
              });
            });

            renderSetupUI();
            updateLeaderboard();
            renderCompletedEvents();
          }
        }
      } catch (err) {
        console.error("Error loading league data:", err);
      }
    }
